<style>

<canvas id="c"></canvas>
<div id="cam" style="position:fixed;right:10px;bottom:8px;font:12px/1.3 ui-monospace,monospace;background:rgba(0,0,0,.55);color:#fff;padding:4px 8px;border-radius:6px;user-select:all"></div>

</div>
<script>const DATA=/*__DATA__*/null;</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/",
  "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/",
  "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.39.5/build/index.js",
  "n8ao": "https://cdn.jsdelivr.net/npm/n8ao@2.0.1/dist/N8AO.js"
} }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { N8AOPass } from 'n8ao';

const H = DATA.H, f = DATA.floor;
const cx = (f.x0 + f.x1) / 2, cy = (f.y0 + f.y1) / 2;
// plan (x, y) in metres, y up  ->  world (x, height, -y), centred
const W = (x, y, h = 0) => new THREE.Vector3(x - cx, h, -(y - cy));

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));   // Retina at 2x costs ~2x the fragment work; quality steps down further if frames get slow (see render loop)
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;           // r183: PCFSoftShadowMap is deprecated (falls back to PCF); softness = shadow.radius
renderer.toneMapping = THREE.NeutralToneMapping;          // lamps are bright up close: roll the highlights off instead of clipping
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0ee);           // light sky, also in dark mode: windows must not look black

const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 200);
camera.position.set(9, 14, 13);
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true;
// left drag = orbit on a sphere around the point at the centre of the view; cmd/ctrl/shift + left drag or right drag = pan
orbit.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };   // cmd/ctrl/shift + left = rotate
orbit.screenSpacePanning = true;
orbit.zoomToCursor = true;
orbit.panSpeed = 1.15;                           // with the target on the floor (below), a drag moves the flat as far as the mouse travels
// Pan distance in OrbitControls is proportional to the camera-target distance, and zoom-to-cursor / rotations let the
// target drift close to the camera or up in the air, which made panning crawl. Before every drag, put the target back
// on the floor along the current view ray: the picture doesn't change, but pan speed and the rotation pivot are right again.
function anchorTarget() {
  const d = orbit.target.clone().sub(camera.position).normalize();
  let k = d.y < -0.03 ? camera.position.y / -d.y : 25;
  k = Math.min(Math.max(k, 1.5), 40);
  orbit.target.copy(camera.position).addScaledVector(d, k);
}
// Plain drag = map-style pan done here, not by OrbitControls: the floor point grabbed stays under the cursor,
// whatever the zoom or tilt. Cmd/Ctrl + drag is left to OrbitControls (rotate around the anchored floor point).
const floorHit = e => {
  const r = new THREE.Raycaster(); r.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
  const o = r.ray.origin, d = r.ray.direction; if (d.y > -0.02) return null;
  const k = -o.y / d.y; return k > 80 ? null : new THREE.Vector3(o.x + d.x * k, 0, o.z + d.z * k);
};
let grab = null;
canvas.addEventListener('pointerdown', e => {
  if (!orbit.enabled) return;
  anchorTarget();
  if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  grab = floorHit(e); if (!grab) return;                    // looking at the sky: let OrbitControls pan
  e.stopImmediatePropagation(); canvas.setPointerCapture(e.pointerId);
}, true);
canvas.addEventListener('pointermove', e => {
  if (!grab) return;
  const h = floorHit(e); if (!h) return;
  const dlt = grab.clone().sub(h); camera.position.add(dlt); orbit.target.add(dlt);
});
const endGrab = () => { grab = null; };
canvas.addEventListener('pointerup', endGrab); canvas.addEventListener('pointercancel', endGrab);
const ROTATE_CURSOR = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'28\' height=\'28\'><g fill=\'none\' stroke=\'white\' stroke-width=\'5\'><path d=\'M22 14a8 8 0 1 1-3-6.2\'/></g><g fill=\'none\' stroke=\'black\' stroke-width=\'2.4\'><path d=\'M22 14a8 8 0 1 1-3-6.2\'/></g><path d=\'M15 3l7 3-5 5z\' fill=\'black\' stroke=\'white\' stroke-width=\'1\'/></svg>')}") 14 14, alias`;
function setCursor(e) { canvas.style.cursor = (e.metaKey || e.ctrlKey) ? ROTATE_CURSOR : 'move'; }
canvas.style.cursor = 'move';
addEventListener('keydown', setCursor); addEventListener('keyup', setCursor); canvas.addEventListener('pointermove', setCursor);
orbit.maxPolarAngle = Math.PI * 0.49;

// ================= lighting engine =================
// Indoors the light comes from the lamps: every room's pendant is a shadow-casting point light, so a wardrobe's
// shadow always falls away from its lamp. The building shell (walls, lintel band, sills, ceiling) stops light
// through invisible closed solids, so a lamp lights only its own room and the sun gets in only through the windows.
// Ambient = sky (hemisphere) + a soft studio environment; screen-space AO (N8AO) adds contact shadows and dark corners.
// Anything added later (IKEA GLBs, boxes) is classified automatically: opaque meshes cast + receive; glass,
// transparent, emissive light fittings and lines never cast. Shadow maps are static: re-rendered only when the
// scene changes (object added/removed, a door swinging): no shadow passes per frame, only the sampling cost.
const LIGHT = { hemi: 0.25, env: 0.15, lamp: 24, lampColor: 0xffe6c8, lampRange: 9, lampRangeUnshadowed: 3.2, sun: 2.6, aoRadius: 0.45, aoIntensity: 3 };
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8070, LIGHT.hemi); scene.add(hemi);
{ const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = LIGHT.env; pmrem.dispose(); }
const shadowLights = [];                                   // lights with static shadow maps, refreshed on scene changes
// WebGL limit: every shadow-casting light is one more sampler in EVERY lit shader, next to the material's own maps
// (IKEA GLBs: map + normal + rough + metal + ao + env = 6) + three's DFG LUT. Apple GPUs (ANGLE/Metal) give 16 units.
// So only the lamps nearest to where you look cast shadows (constant count = no shader recompiles); the rest light unshadowed.
let maxMatTex = 1;
const texCount = m => { let n = m.envMap ? 0 : 1; for (const k in m) if (m[k] && m[k].isTexture) n++; return n; };   // +1: scene.environment
const shadowSlots = () => Math.max(1, renderer.capabilities.maxTextures - maxMatTex - 3);
const roomLamps = [];
let lampFocus = null;
function assignLampShadows(force = false) {          // the N lamps nearest the view focus cast; re-ranked when the focus moves 0.5 m
  const focus = (fp.isLocked ? camera.position : orbit.target).clone().setY(0);
  if (!force && lampFocus && lampFocus.distanceTo(focus) < 0.5) return;
  lampFocus = focus;
  const n = shadowSlots() - (sun.castShadow ? 1 : 0);
  const d = l => Math.hypot(l.position.x - focus.x, l.position.z - focus.z);
  [...roomLamps].sort((a, b) => d(a) - d(b)).forEach((l, i) => { const on = i < n; if (l.castShadow !== on) { l.castShadow = on; l.shadow.needsUpdate = true; }
    l.distance = on ? LIGHT.lampRange : LIGHT.lampRangeUnshadowed; });   // an unshadowed lamp shines through walls: keep it short
}
function markShadowsDirty(near, radius = Infinity) {      // near: world point (e.g. a door) -> only lights that reach it
  for (const l of shadowLights) if (!near || l.isDirectionalLight || l.position.distanceTo(near) < Math.min(radius, l.distance || Infinity))
    l.shadow.needsUpdate = true;
}
function staticShadow(light) { light.shadow.autoUpdate = false; light.shadow.needsUpdate = true; shadowLights.push(light); return light; }
const sun = new THREE.DirectionalLight(0xfff1dc, LIGHT.sun);
sun.position.set(-8, 14, 6);
sun.castShadow = true;                                    // the ceiling + walls let it in only through the windows
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
sun.shadow.bias = -0.008;        // large on purpose: the shell solids' inner end faces sit exactly on the wall surface at every seam and drew dark lines
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3;
scene.add(staticShadow(sun));
// automatic shadow policy, applied to everything that is ever added to the scene
const mats = o => [].concat(o.material).filter(Boolean);
function autoShadow(o) {
  if (!o.isMesh) return;
  for (const m of mats(o)) { const n = texCount(m); if (n > maxMatTex) { maxMatTex = n; lampFocus = null; } }   // fewer lamp shadows if needed
  o.receiveShadow = o.userData.receiveShadow ?? true;
  if (o.userData.castShadow !== undefined) { o.castShadow = o.userData.castShadow; return; }
  o.castShadow = !mats(o).some(m => m.colorWrite === false || m.transmission > 0 || (m.transparent && m.opacity < 0.95)
    || (m.emissive && m.emissiveIntensity > 0 && m.emissive.getHex() !== 0));   // glowing shade/glass: the bulb is inside it
}
const watched = new WeakSet();
const casts = root => { let c = false; root.traverse(o => { c ||= o.isMesh && o.castShadow && o.visible; }); return c; };
function watch(root) {
  root.traverse(o => {
    autoShadow(o);
    if (watched.has(o)) return; watched.add(o);
    o.addEventListener('childadded', e => { watch(e.child); if (casts(e.child)) markShadowsDirty(); });
    o.addEventListener('childremoved', e => { if (casts(e.child)) markShadowsDirty(); });   // hover halos etc. cost nothing
  });
}
// invisible, shadow-only closed solid (no colour, no depth: the visible finishes stay the textured wall faces)
const shadowOnlyMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
function shadowSolid(geo) { const m = new THREE.Mesh(geo, shadowOnlyMat); m.userData.castShadow = true; m.userData.receiveShadow = false; m.name = 'shadow-shell'; return m; }

// one clipping plane = "dollhouse" cut of every wall above a height
const cut = new THREE.Plane(new THREE.Vector3(0, -1, 0), H.wall + 0.01);   // just above the caps (no z-fight)
// lintels and sills sit in the openings; polygonOffset keeps them behind any wall face they touch (no z-fighting flicker)
const wallMat = new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 0.9, clippingPlanes: [cut], clipShadows: true, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
const capMat = new THREE.MeshStandardMaterial({ color: 0xf7f6f2, roughness: 1, clippingPlanes: [cut] });   // wall tops: white
const glassMat = new THREE.MeshStandardMaterial({ color: 0x9ccaf0, transparent: true, opacity: 0.35, roughness: 0.1, clippingPlanes: [cut] });
const pvcMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.4, clippingPlanes: [cut] });
const railMat = new THREE.MeshStandardMaterial({ color: 0xc9ced4, metalness: 0.6, roughness: 0.35 });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x3a3f46, clippingPlanes: [cut] });

const group = new THREE.Group();
scene.add(group);
function addMesh(geo, mat, edges = false) {
  const m = new THREE.Mesh(geo, mat);
  // cast / receive: decided by the lighting engine (autoShadow)
  group.add(m);
  if (edges) group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat));
  return m;
}

// wall finishes per room: paint, wallpaper (stripes / dots) or tiles, drawn on a canvas and repeated
function finish(kind, base, accent) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  g.fillStyle = accent; g.strokeStyle = accent;
  if (kind === 'stripes') for (let x = 0; x < 256; x += 32) g.fillRect(x, 0, 12, 256);
  if (kind === 'dots') for (let y = 16; y < 256; y += 32) for (let x = (y / 32 % 2) * 16 + 16; x < 256; x += 32) { g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill(); }
  if (kind === 'tiles') { g.lineWidth = 3; for (let i = 0; i <= 256; i += 64) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.moveTo(0, i); g.lineTo(256, i); g.stroke(); } }
  // (paint = plain colour)
  const tx = new THREE.CanvasTexture(c);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4;
  return new THREE.MeshStandardMaterial({ map: tx, roughness: kind === 'tiles' ? 0.35 : 0.9, clippingPlanes: [cut], clipShadows: true, side: THREE.DoubleSide });
}
// tile = metres covered by one canvas repeat
const ROOM = {
  '-1': ['paint', '#f6f5f1', '#e4e2dc', 1.2],   // reveals / jambs in the openings
  0:  ['paint',   '#ecebe6', '#d8d6cf', 1.2],   // outside of the building
  1:  ['paint',   '#efe0c8', '#d9c4a3', 1.2],   // Camera 17,80 - warm sand
  2:  ['paint'  , '#dfe8d8', '#c9d8be', 0.8],   // Camera 11,45 - sage striped wallpaper
  3:  ['paint',   '#d6e4f0', '#bccfe0', 1.2],   // Camera 10,23 - light blue
  4:  ['paint',   '#ebe0f0', '#d4c2df', 0.6],   // Camera 10,23 - lavender dotted wallpaper
  5:  ['paint',   '#f3efe2', '#d9d2bd', 0.6],   // Bucatarie - cream tiles
  6:  ['paint',   '#e6f1f6', '#b9d3df', 0.4],   // Baie - white/blue tiles
  7:  ['paint',   '#d9efe9', '#a9d3c7', 0.4],   // Baie - aqua tiles
  8:  ['paint',   '#e4e4e4', '#cfcfcf', 1.2],   // Camara
  9:  ['paint',   '#e4e4e4', '#cfcfcf', 1.2],   // Debara
  10: ['paint',   '#e4e4e4', '#cfcfcf', 1.2],   // Debara
  11: ['paint',   '#e9e2d6', '#d3c9b8', 1.2],   // Hol - warm grey
  12: ['paint',   '#f3ecc9', '#ddd3a6', 1.2],   // Oficiu - pale yellow
  13: ['paint',   '#e8e4dc', '#d2ccc0', 1.2],   // Balcon
  14: ['paint',   '#e8e4dc', '#d2ccc0', 1.2],   // Balcon
};
const roomMat = {};
for (const [k, [kind, base, accent]] of Object.entries(ROOM)) roomMat[k] = finish(kind, base, accent);

// walls: three height bands, each one continuous; every face finished like the room it faces
for (const { o, h } of DATA.caps) {
  const shape = new THREE.Shape(o.map(([x, y]) => new THREE.Vector2(x - cx, y - cy)));
  for (const hole of h) shape.holes.push(new THREE.Path(hole.map(([x, y]) => new THREE.Vector2(x - cx, y - cy))));
  const cap = new THREE.ShapeGeometry(shape);
  cap.rotateX(-Math.PI / 2); cap.translate(0, H.wall, 0);
  addMesh(cap, capMat);
}
for (const [x0, y0, x1, y1, k, h0, h1] of DATA.bandFaces) {
  const a = W(x0, y0), b = W(x1, y1), len = a.distanceTo(b), hh = h1 - h0;
  const g = new THREE.PlaneGeometry(len + 0.002, hh + 0.001);        // 1 mm overlap: no hairline cracks at corners or between bands
  const m = new THREE.Mesh(g, roomMat[k] || roomMat[0]);
  m.position.set((a.x + b.x) / 2, (h0 + h1) / 2, (a.z + b.z) / 2);
  m.rotation.y = -Math.atan2(b.z - a.z, b.x - a.x);
  m.userData.castShadow = false;   // double-sided planes shadowing themselves = acne; the closed shell solids cast instead
  group.add(m);
}
// shadow shell: closed solids, so lamp light stays in its room and sunlight enters only through the windows
{
  const shapeOf = (o, holes = []) => { const s = new THREE.Shape(o.map(([x, y]) => new THREE.Vector2(x - cx, y - cy)));
    for (const h of holes) s.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x - cx, y - cy)))); return s; };
  const prism = (shape, h0, h1) => { const g = new THREE.ExtrudeGeometry(shape, { depth: h1 - h0, bevelEnabled: false });
    g.rotateX(-Math.PI / 2); g.translate(0, h0, 0); return g; };
  for (const w of DATA.walls) group.add(shadowSolid(prism(shapeOf(w), 0, H.wall)));                       // wall pieces
  for (const { o, h } of DATA.caps) group.add(shadowSolid(prism(shapeOf(o, h), Math.min(H.door, H.win), H.wall)));   // band over doors / windows
  for (const { r: [x0, y0, x1, y1], k } of DATA.gaps) if (k === 'window') {                                // parapet under each window
    const g = new THREE.BoxGeometry(x1 - x0, H.sill, y1 - y0); g.translate((x0 + x1) / 2 - cx, H.sill / 2, -((y0 + y1) / 2 - cy));
    group.add(shadowSolid(g));
  }
}
// soffits over the openings and window-sill tops: white horizontal faces
for (const { r: [x0, y0, x1, y1], k } of DATA.gaps) {
  const soffit = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0), capMat);
  soffit.rotation.x = Math.PI / 2; soffit.position.copy(W((x0 + x1) / 2, (y0 + y1) / 2, k === 'window' ? H.win : H.door)); group.add(soffit);
  if (k === 'window') {
    const sill = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0), capMat);
    sill.rotation.x = -Math.PI / 2; sill.position.copy(W((x0 + x1) / 2, (y0 + y1) / 2, H.sill)); group.add(sill);
  }
}

// openings: a gap rect gets a lintel; a window also a sill and a pane
function box(x0, y0, x1, y1, h0, h1, mat, edges = false) {
  if (h1 - h0 < 1e-3) return;
  const g = new THREE.BoxGeometry(x1 - x0, h1 - h0, y1 - y0);
  g.translate((x0 + x1) / 2 - cx, (h0 + h1) / 2, -((y0 + y1) / 2 - cy));
  addMesh(g, mat, edges);
}
for (const { r: [x0, y0, x1, y1], k, axis } of DATA.gaps) {
  const top = k === 'window' ? H.win : H.door;
  // white core (soffit + top); its long sides are covered by the room-finished quads below, 1 mm proud
  const ins = 0.001, [ix0, iy0, ix1, iy1] = axis === 'x' ? [x0, y0 + ins, x1, y1 - ins] : [x0 + ins, y0, x1 - ins, y1];

  if (k === 'window') {

    // pane in the middle of the wall thickness
    const t = 0.02;
    const fw = 0.06, fd = 0.07;                        // PVC profile width / depth
    if (axis === 'x') { const m = (y0 + y1) / 2; box(x0, m - t, x1, m + t, H.sill, H.win, glassMat, false);
